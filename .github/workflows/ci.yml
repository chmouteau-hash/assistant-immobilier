name: CI

# Minimale, volontairement : typecheck + lint + build. Rien de la machinerie de gouvernance
# documentaire d'Ergonomia (pas de spec ACTIVE/PROPOSITION, pas de traçabilité exigence↔code) —
# disproportionnée pour un dossier personnel à un seul utilisateur. À durcir seulement sur un
# déclencheur réel (un second contributeur, un premier abonné) — voir DECISIONS.md.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
